name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Angular 18 supports Node 22 at most
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests (Chrome headless)
        run: npm run test:ci
